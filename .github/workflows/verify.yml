name: Verificar notebook del Taller 3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas para Spearman
        run: python -m pip install numpy scipy
      - name: Ejecutar todas las celdas del notebook y sus aserciones
        run: python tests/verify_notebook.py
